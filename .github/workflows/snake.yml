name: generate snake animation

on:
  # refresh the animation every day
  schedule:
    - cron: "0 0 * * *"

  # allow running it by hand from the Actions tab
  workflow_dispatch:

  # and whenever the profile is updated
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # builds a snake animation from the contribution graph of the repository owner
      - name: generate the snake svg files
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # publishes the files on the "output" branch
      - name: push the svg files to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
